[project]
name = "testpilot-backend"
version = "0.1.0"
description = "TestPilot API: multi-LLM autonomous web testing platform"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "aiosqlite==0.22.1",
    "redis==8.1.0",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "google-genai==3.0.0",
    "anthropic==2.6.0",
    "openai==3.46.0",
    "httpx2==2.16.0",
    "celery==5.7.0",
]

[project.optional-dependencies]
# Where browsers run: the browser-worker image and local development (ThreadedBrowserClient).
browser = ["playwright==1.62.0"]
dev = [
    "playwright==1.62.0",
    "fakeredis==2.40.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "browser_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "browser_worker", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
# Prompt text and generated-code templates are content, not logic.
"app/services/test_generation/prompts.py" = ["E501"]
"app/services/test_generation/renderer.py" = ["E501"]
"app/services/reports/report_service.py" = ["E501"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
