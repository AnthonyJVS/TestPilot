# TestPilot local stack.
#   cp .env.example .env   # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up --build
#   open http://localhost:8080
#
# Only the frontend (Nginx) port is published. PostgreSQL and Redis live on an internal
# network without internet access; the API is reachable only through Nginx.
#
# Test runs (milestone 4): the API queues a job in Redis, the Celery `worker` orchestrates it and
# sends browser commands over Redis to `browser-worker`, an isolated container with Playwright,
# no database access, no credentials and its own networks (Redis + internet only).
name: testpilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testpilot}
      POSTGRES_USER: ${POSTGRES_USER:-testpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal, browser]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-testpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testpilot}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      # AES-256-GCM keys for stored AI provider credentials: "v1:<base64url 32 bytes>[,old...]".
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?Set ENCRYPTION_KEYS in .env (see .env.example)}
      # Plain-HTTP localhost demo. Set COOKIE_SECURE=true whenever TestPilot is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The API port is not published; only Nginx on the compose network can reach it.
      FORWARDED_ALLOW_IPS: "*"
      # Runs execute in the Celery worker and the isolated browser-worker container.
      EXECUTION_MODE: celery
      BROWSER_TRANSPORT: redis
      ARTIFACTS_DIR: /artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - artifacts:/artifacts:ro  # served through ownership-checked endpoints only
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # `edge` gives the API outbound internet access (needed for AI providers from milestone 2).
    networks: [internal, edge]

  # Celery orchestrator: claims queued runs, resolves test data, drives the browser worker and
  # records events. Holds DB and decryption keys, never runs a browser.
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes:
      # Read-write for artifact retention: python -m app.maintenance cleanup-artifacts
      - artifacts:/artifacts
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, edge]

  # Isolated browser worker: Playwright + browsers only. No database, no secrets; reaches Redis
  # through a dedicated network and the internet through its own egress network.
  browser-worker:
    build:
      context: ./backend
      dockerfile: browser_worker.Dockerfile
    restart: unless-stopped
    environment:
      BROWSER_WORKER_REDIS_URL: redis://redis:6379/0
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    cpus: 2
    depends_on:
      redis:
        condition: service_healthy
    networks: [browser, browser-egress]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${TESTPILOT_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]

networks:
  internal:
    internal: true
  edge: {}
  # Redis <-> browser worker only (no PostgreSQL, no API, no internet).
  browser:
    internal: true
  # Outbound internet for the browser worker, shared with nothing else.
  browser-egress: {}

volumes:
  pgdata:
  redisdata:
  artifacts:
